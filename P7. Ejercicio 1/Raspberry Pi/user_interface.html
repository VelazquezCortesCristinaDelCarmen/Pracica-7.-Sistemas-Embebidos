<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control LED</title>
    <style>
        body { font-family: sans-serif; background-color: #e2e2e2; text-align: center; margin: 0; padding: 20px; }
        h1 { margin-bottom: 30px; font-weight: normal; color: #222; }
        
        .container { display: flex; justify-content: center; gap: 50px; align-items: flex-start; }
        .section-title { font-weight: bold; margin-bottom: 20px; font-size: 18px; color: #444; }

        /* Contenedor de LEDs */
        .leds-wrapper { display: flex; gap: 10px; margin-bottom: 25px; }
        .led-circle { 
            width: 45px; height: 45px; border-radius: 50%; background-color: #b83b4b; 
            color: white; display: flex; align-items: center; justify-content: center; 
            font-weight: bold; cursor: pointer; user-select: none; transition: background-color 0.1s, box-shadow 0.1s;
        }
        .led-circle.active { 
            background-color: #ffcc00; color: #000; box-shadow: 0 0 15px #ffcc00; 
        }

        /* Control de Velocidad y Botones de Marquesina */
        .speed-control { margin-bottom: 15px; text-align: left; background: #d0d0d0; padding: 10px; border-radius: 4px; }
        .speed-control label { font-size: 14px; font-weight: bold; color: #333; display: block; margin-bottom: 5px; }
        .speed-control input { width: 100%; }

        .btn-marquee { 
            display: block; width: 100%; padding: 10px; margin-bottom: 8px; 
            border: 1px solid #ccc; background-color: #f0f0f0; cursor: pointer; font-size: 15px; border-radius: 3px;
        }
        .btn-marquee:active { background-color: #ddd; }

        /* Pantalla digital del Display */
        .display-screen {
            background-color: #111; color: #00ff66; font-family: 'Courier New', monospace;
            font-size: 32px; font-weight: bold; padding: 10px; border-radius: 6px;
            margin-bottom: 15px; border: 2px solid #333; box-shadow: inset 0 0 8px #000;
        }

        /* Teclado Display */
        .keypad { display: grid; grid-template-columns: repeat(3, 60px); gap: 2px; background-color: #2b3541; padding: 4px; border-radius: 4px; }
        .keypad button { 
            height: 60px; background-color: #eef1f5; border: none; font-size: 20px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
        }
        .keypad button:active { background-color: #cccccc; }
        .keypad .btn-zero { grid-column: span 3; width: 60px; margin: 0 auto; }
    </style>
</head>
<body>

    <h1>Panel de Control LED</h1>

    <div class="container">
        <!-- Panel Izquierdo: LEDs, Velocidad y Marquesinas -->
        <div>
            <div class="section-title">Leds</div>
            <div class="leds-wrapper">
                <div class="led-circle" id="led-1" onclick="sendCmd('led', '1')">1</div>
                <div class="led-circle" id="led-2" onclick="sendCmd('led', '2')">2</div>
                <div class="led-circle" id="led-3" onclick="sendCmd('led', '3')">3</div>
                <div class="led-circle" id="led-4" onclick="sendCmd('led', '4')">4</div>
                <div class="led-circle" id="led-5" onclick="sendCmd('led', '5')">5</div>
                <div class="led-circle" id="led-6" onclick="sendCmd('led', '6')">6</div>
                <div class="led-circle" id="led-7" onclick="sendCmd('led', '7')">7</div>
            </div>

            <!-- Control deslizable para la velocidad -->
            <div class="speed-control">
                <label for="speedSlider">Velocidad: <span id="speedVal">150</span> ms</label>
                <input type="range" id="speedSlider" min="50" max="500" step="25" value="150" oninput="document.getElementById('speedVal').innerText = this.value">
            </div>

            <button class="btn-marquee" onclick="sendCmd('marquee', 'left')">Marquesina Izq.</button>
            <button class="btn-marquee" onclick="sendCmd('marquee', 'right')">Marquesina Der.</button>
            <button class="btn-marquee" onclick="sendCmd('marquee', 'pingpong')">Ping-pong</button>
        </div>

        <!-- Panel Derecho: Display Teclado y Pantalla Digital -->
        <div>
            <div class="section-title">Display</div>
            
            <div class="display-screen" id="digit-display">-</div>

            <div class="keypad">
                <button onclick="sendCmd('numpad', '7')">7</button>
                <button onclick="sendCmd('numpad', '8')">8</button>
                <button onclick="sendCmd('numpad', '9')">9</button>
                <button onclick="sendCmd('numpad', '4')">4</button>
                <button onclick="sendCmd('numpad', '5')">5</button>
                <button onclick="sendCmd('numpad', '6')">6</button>
                <button onclick="sendCmd('numpad', '1')">1</button>
                <button onclick="sendCmd('numpad', '2')">2</button>
                <button onclick="sendCmd('numpad', '3')">3</button>
                <button class="btn-zero" onclick="sendCmd('numpad', '0')">0</button>
            </div>
        </div>
    </div>

    <script>
        function sendCmd(action, value) {
            // Leer la velocidad seleccionada en el slider (convertida a segundos)
            const speedMs = document.getElementById('speedSlider').value;
            const speedSec = parseFloat(speedMs) / 1000.0;

            fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: action, 
                    value: value, 
                    speed: speedSec 
                })
            });
        }

        // Consultar continuamente el estado de la Raspberry Pi
        setInterval(() => {
            fetch('/status')
                .then(res => res.json())
                .then(data => {
                    if (data) {
                        if (data.leds) {
                            data.leds.forEach((state, idx) => {
                                const elem = document.getElementById(`led-${idx + 1}`);
                                if (elem) {
                                    if (state === 1) {
                                        elem.classList.add('active');
                                    } else {
                                        elem.classList.remove('active');
                                    }
                                }
                            });
                        }
                        if (data.display !== undefined) {
                            document.getElementById('digit-display').innerText = data.display;
                        }
                    }
                })
                .catch(() => {});
        }, 80);
    </script>
</body>
</html>
